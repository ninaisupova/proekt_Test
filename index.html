<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ЧУДЕСА — контент эксперта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --bg-elevated: #0d0d0f;
      --ink: #f2f2f4;
      --muted: #9a9aa3;
      --silver: #c8ccd4;
      --silver-bright: #eef1f6;
      --silver-dim: #8a909c;
      --line: rgba(200, 204, 212, 0.18);
      --card: rgba(16, 16, 18, 0.88);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      --ok: #8fbc8f;
      --bad: #c47a7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background: var(--bg);
      padding: 2rem 1.25rem 3rem;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 45% at 50% -5%, rgba(200, 204, 212, 0.14), transparent 55%),
        radial-gradient(ellipse 40% 30% at 90% 20%, rgba(170, 175, 185, 0.08), transparent 50%),
        radial-gradient(ellipse 35% 28% at 8% 70%, rgba(180, 185, 195, 0.06), transparent 50%),
        linear-gradient(180deg, #050505 0%, #0a0a0c 50%, #050505 100%);
      z-index: 0;
    }

    .silver-dust {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .silver-dust span {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--silver-bright);
      box-shadow: 0 0 8px rgba(238, 241, 246, 0.8);
      opacity: 0;
      animation: sparkle 5.5s ease-in-out infinite;
    }

    .silver-dust span:nth-child(1) { left: 12%; top: 18%; animation-delay: 0s; }
    .silver-dust span:nth-child(2) { left: 78%; top: 12%; animation-delay: 1.1s; width: 3px; height: 3px; }
    .silver-dust span:nth-child(3) { left: 55%; top: 28%; animation-delay: 2.2s; }
    .silver-dust span:nth-child(4) { left: 22%; top: 62%; animation-delay: 0.7s; }
    .silver-dust span:nth-child(5) { left: 88%; top: 55%; animation-delay: 1.8s; width: 3px; height: 3px; }
    .silver-dust span:nth-child(6) { left: 40%; top: 78%; animation-delay: 3s; }
    .silver-dust span:nth-child(7) { left: 66%; top: 88%; animation-delay: 0.4s; }
    .silver-dust span:nth-child(8) { left: 8%; top: 40%; animation-delay: 2.6s; }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 2.25rem;
      animation: rise 0.8s ease both;
    }

    .brand {
      font-family: "Cinzel", serif;
      font-size: clamp(2.8rem, 9vw, 4.8rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1.05;
      background: linear-gradient(
        110deg,
        #7a7f88 0%,
        #c8ccd4 22%,
        #ffffff 38%,
        #a8adb8 55%,
        #eef1f6 72%,
        #8a909c 100%
      );
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: silverFlow 4.5s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(200, 204, 212, 0.25));
    }

    .brand-line {
      width: min(220px, 50vw);
      height: 1px;
      margin: 1rem auto 0;
      background: linear-gradient(90deg, transparent, var(--silver), transparent);
      position: relative;
      overflow: hidden;
    }

    .brand-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      transform: translateX(-100%);
      animation: lineSweep 2.8s ease-in-out infinite;
    }

    .subtitle {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 36rem;
      margin-inline: auto;
      animation: fadeIn 1s ease 0.25s both;
    }

    .controls {
      margin-bottom: 2rem;
      animation: rise 0.8s ease 0.12s both;
    }

    .experts-label {
      display: block;
      font-size: 0.9rem;
      color: var(--silver-dim);
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .experts {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .expert-chip {
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .expert-chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .expert-chip span {
      display: inline-block;
      padding: 0.55rem 0.95rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
      transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    .expert-chip:hover span {
      border-color: rgba(200, 204, 212, 0.4);
      color: var(--silver);
    }

    .expert-chip input:checked + span {
      color: #0a0a0c;
      background: linear-gradient(135deg, #9aa0aa 0%, #e8ebf0 45%, #b8bec8 100%);
      border-color: transparent;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2), 0 6px 18px rgba(200, 204, 212, 0.18);
    }

    .expert-chip input:focus-visible + span {
      outline: 2px solid var(--silver);
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    button {
      font: inherit;
      font-weight: 700;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 0.75rem 1.4rem;
      transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease;
    }

    button:active { transform: scale(0.97); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      position: relative;
      overflow: hidden;
      color: #0a0a0c;
      background: linear-gradient(135deg, #9aa0aa 0%, #e8ebf0 45%, #b8bec8 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2),
        0 8px 28px rgba(200, 204, 212, 0.22);
    }

    .btn-primary::before {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      animation: btnShine 2.8s ease-in-out infinite;
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35),
        0 10px 36px rgba(220, 224, 232, 0.35);
    }

    .btn-ghost {
      background: transparent;
      color: var(--silver);
      border: 1px solid rgba(200, 204, 212, 0.35);
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(200, 204, 212, 0.08);
      border-color: rgba(200, 204, 212, 0.65);
      box-shadow: 0 0 20px rgba(200, 204, 212, 0.12);
    }

    .hint {
      text-align: center;
      color: var(--bad);
      font-size: 0.9rem;
      margin-top: 0.85rem;
      min-height: 1.25rem;
    }

    .result {
      display: grid;
      gap: 1rem;
    }

    .panel {
      position: relative;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.15rem 1.25rem 1.3rem;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: riseSilver 0.65s ease both;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(238, 241, 246, 0.7), transparent);
      animation: borderGlow 3.2s ease-in-out infinite;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .panel-title {
      font-family: "Cinzel", serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--silver-bright);
    }

    .panel-meta {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--silver-dim), var(--silver-bright), var(--silver-dim));
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: silverFlow 3.5s linear infinite;
    }

    .label {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--silver);
      margin-bottom: 0.45rem;
      text-shadow: 0 0 12px rgba(200, 204, 212, 0.35);
    }

    .post-text {
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--ink);
      white-space: pre-line;
    }

    .expert-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 1rem;
    }

    .expert-tags span {
      font-size: 0.78rem;
      color: var(--silver-dim);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.25rem 0.65rem;
    }

    .quiz {
      display: grid;
      gap: 1rem;
    }

    .question {
      padding: 0.85rem 0 0;
      border-top: 1px solid var(--line);
    }

    .question:first-child {
      border-top: none;
      padding-top: 0;
    }

    .question-title {
      font-weight: 700;
      margin-bottom: 0.65rem;
      line-height: 1.4;
    }

    .options {
      display: grid;
      gap: 0.45rem;
    }

    .option {
      text-align: left;
      width: 100%;
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 600;
      box-shadow: none;
    }

    .option:hover:not(:disabled) {
      border-color: rgba(200, 204, 212, 0.45);
      background: rgba(200, 204, 212, 0.08);
    }

    .option.is-correct {
      border-color: rgba(143, 188, 143, 0.7);
      background: rgba(143, 188, 143, 0.12);
      color: #d8efd8;
    }

    .option.is-wrong {
      border-color: rgba(196, 122, 122, 0.7);
      background: rgba(196, 122, 122, 0.12);
      color: #f0d0d0;
    }

    .feedback {
      margin-top: 0.55rem;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2rem;
    }

    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
      border: 1px dashed rgba(200, 204, 212, 0.28);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.02);
      animation: rise 0.6s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes riseSilver {
      from {
        opacity: 0;
        transform: translateY(18px);
        box-shadow: 0 0 0 rgba(200, 204, 212, 0);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        box-shadow: var(--shadow);
      }
    }

    @keyframes silverFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes lineSweep {
      0%, 20% { transform: translateX(-100%); }
      55%, 100% { transform: translateX(120%); }
    }

    @keyframes btnShine {
      0%, 35% { left: -40%; }
      70%, 100% { left: 120%; }
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.6); }
      40%, 60% { opacity: 0.9; transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 560px) {
      .actions { flex-direction: column; }
      button { width: 100%; }
      .brand { letter-spacing: 0.14em; }
      .panel-head { flex-direction: column; align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="silver-dust" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
  <div class="wrap">
    <header>
      <h1 class="brand">ЧУДЕСА</h1>
      <div class="brand-line" aria-hidden="true"></div>
      <p class="subtitle">Выбери экспертов — получи пост на день 1 и вовлекающий мини-тест</p>
    </header>

    <div class="controls">
      <span class="experts-label">Эксперты (можно выбрать несколько)</span>
      <div class="experts" id="experts"></div>
      <div class="actions">
        <button class="btn-primary" id="generate" type="button">Сгенерировать</button>
        <button class="btn-ghost" id="copy" type="button" hidden>Скопировать контент</button>
      </div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </div>

    <div class="result" id="result">
      <div class="empty">Выбери одного или нескольких экспертов и нажми «Сгенерировать»</div>
    </div>
  </div>

  <script>
    const EXPERTS = [
      { id: "photographer", label: "Фотограф" },
      { id: "psychologist", label: "Психолог" },
      { id: "trainer", label: "Тренер" },
      { id: "nutritionist", label: "Нутрициолог" },
      { id: "stylist", label: "Стилист" },
      { id: "coach", label: "Коуч" },
      { id: "makeup", label: "Визажист" }
    ];

    const CONTENT = {
      photographer: {
        hooks: [
          "Свет решает больше, чем камера",
          "Один кадр может рассказать целую историю",
          "Красивое фото начинается ещё до нажатия кнопки"
        ],
        tips: [
          "снимай у окна — мягкий свет делает лицо живым без фильтров",
          "оставь в кадре «воздух»: пространство вокруг героя усиливает эмоцию",
          "попроси модель моргнуть и сразу улыбнуться — получится естественный взгляд"
        ],
        quiz: [
          {
            q: "Что сильнее влияет на «дорогой» вид фото?",
            options: ["Разрешение камеры", "Свет и композиция", "Количество лайков"],
            correct: 1
          },
          {
            q: "Где обычно самый мягкий естественный свет?",
            options: ["Прямо под полуденным солнцем", "У окна в тени", "Под неоновой вывеской"],
            correct: 1
          },
          {
            q: "Зачем оставлять пространство вокруг героя?",
            options: ["Чтобы кадр выглядел пустым", "Чтобы усилить эмоцию и дыхание кадра", "Чтобы скрыть недостатки объектива"],
            correct: 1
          },
          {
            q: "Что помогает получить естественную улыбку?",
            options: ["Долго держать улыбку 20 секунд", "Моргнуть и сразу улыбнуться", "Смотреть только в пол"],
            correct: 1
          },
          {
            q: "Главный секрет портрета для соцсетей?",
            options: ["Максимум эффектов", "Эмоция и понятный свет", "Чёрно-белый фильтр всегда"],
            correct: 1
          }
        ]
      },
      psychologist: {
        hooks: [
          "Спокойствие — это навык, а не случайность",
          "Маленький шаг часто сильнее большого рывка",
          "То, как мы говорим с собой, меняет день"
        ],
        tips: [
          "замечай первые признаки напряжения: сжатые плечи, поверхностное дыхание",
          "задай себе вопрос: «Что мне нужно прямо сейчас — отдых, граница или действие?»",
          "замени «я должен» на «я выбираю» — появляется ощущение опоры"
        ],
        quiz: [
          {
            q: "Что чаще всего помогает быстрее снизить тревогу?",
            options: ["Игнор своих чувств", "Заметить телесные сигналы и замедлиться", "Спорить с тревогой до победы"],
            correct: 1
          },
          {
            q: "Почему «маленькие шаги» работают?",
            options: ["Они выглядят красиво в сторис", "Снижают сопротивление и дают ощущение прогресса", "Заменяют всю терапию"],
            correct: 1
          },
          {
            q: "Фраза «я выбираю» вместо «я должен» даёт…",
            options: ["Чувство контроля и опоры", "Больше вины", "Полное отсутствие ответственности"],
            correct: 0
          },
          {
            q: "Что полезно спросить себя в сложный момент?",
            options: ["Почему со мной всегда так?", "Что мне нужно прямо сейчас?", "Кто виноват?"],
            correct: 1
          },
          {
            q: "Спокойствие — это…",
            options: ["Только врождённая черта", "Навык, который можно тренировать", "Признак слабости"],
            correct: 1
          }
        ]
      },
      trainer: {
        hooks: [
          "Сила растёт не от идеальной тренировки, а от регулярности",
          "Тело отвечает на внимание быстрее, чем на давление",
          "Короткая, но честная сессия лучше пропущенного дня"
        ],
        tips: [
          "начни с разминки 3–5 минут — суставы и нервная система скажут «спасибо»",
          "следи за техникой: качество повторения важнее количества",
          "после нагрузки сделай 2 минуты спокойного дыхания — восстановление начинается сразу"
        ],
        quiz: [
          {
            q: "Что важнее для прогресса в долгую?",
            options: ["Идеальная тренировка раз в месяц", "Регулярность", "Только тяжёлые веса"],
            correct: 1
          },
          {
            q: "Зачем нужна разминка?",
            options: ["Чтобы потратить время", "Чтобы подготовить суставы и нервную систему", "Чтобы сразу устать"],
            correct: 1
          },
          {
            q: "Что выбрать: много кривых повторов или меньше, но чистых?",
            options: ["Больше любой ценой", "Меньше, но с техникой", "Без разницы"],
            correct: 1
          },
          {
            q: "Когда начинается восстановление?",
            options: ["Только на следующий день", "Сразу после нагрузки", "Только в отпуске"],
            correct: 1
          },
          {
            q: "Лучшая стратегия «нет сил»?",
            options: ["Пропустить совсем", "Сделать короткую честную сессию", "Удвоить нагрузку из чувства вины"],
            correct: 1
          }
        ]
      },
      nutritionist: {
        hooks: [
          "Еда — это энергия и забота, а не поле битвы",
          "Стабильный рацион сильнее жёстких запретов",
          "Тарелка может быть и вкусной, и поддерживающей"
        ],
        tips: [
          "собери тарелку по принципу: белок + овощи + сложный углевод",
          "пей воду до ощущения жажды — энергия часто падает от обезвоживания",
          "добавь один «якорь» дня: нормальный завтрак, который реально съедаешь"
        ],
        quiz: [
          {
            q: "Что устойчивее жёстких запретов?",
            options: ["Полный отказ от любимых блюд", "Стабильный понятный рацион", "Голодание по настроению"],
            correct: 1
          },
          {
            q: "Базовый принцип сытной тарелки?",
            options: ["Только салат", "Белок + овощи + сложный углевод", "Только сладкое «за компанию»"],
            correct: 1
          },
          {
            q: "Почему вода важна для энергии?",

          {

          },
          {

            options: ["Наказание себя", "Поддержку энергии и заботу", "Идеальные фото еды"],
            correct: 1
          }
        ]
      },
      stylist: {
        hooks: [
          "Стиль — это ясность образа, а не количество вещей",
          "Один сильный акцент собирает весь look",

        ],
        tips: [
          "выбери базу нейтральных вещей и добавь 1 акцент цвета или фактуры",

          "повторяй удачные сочетания: стиль растёт из повторяемых решений"
        ],
        quiz: [
          {
            q: "Что делает образ собранным быстрее всего?",
            options: ["Максимум трендов сразу", "Один сильный акцент на спокойной базе", "Случайный шопинг"],
            correct: 1
          },
          {
            q: "Почему важна посадка?",
            options: ["Только для фото", "Она влияет на силуэт и ощущение уверенности", "Она не важна"],
            correct: 1
          },
          {
            q: "Как быстрее найти «свой» стиль?",
            options: ["Покупать всё новое", "Повторять удачные сочетания", "Игнорировать комфорт"],
            correct: 1
          },
          {
            q: "Нейтральная база нужна, чтобы…",
            options: ["Выглядеть скучно", "Легко добавлять акценты", "Носить только чёрное"],

          },

            options: ["Цена бренда", "Ясность образа", "Количество вещей в шкафу"],

          }
        ]
      },
      coach: {
        hooks: [

        ],
        tips: [

        ],
        quiz: [
          {

            options: ["Только вдохновение", "Ближайший конкретный шаг", "Ожидание идеального момента"],
            correct: 1
          },
          {
            q: "Что важнее постоянной мотивации?",
            options: ["Фокус и система", "Ждать подъёма", "Сравнивать себя с другими"],
            correct: 0
          },
          {
            q: "Зачем формулировать цель на неделю?",
            options: ["Чтобы красиво звучало", "Чтобы сузить фокус и измерить прогресс", "Чтобы усложнить жизнь"],
            correct: 1
          },
          {
            q: "Куда поставить ключевое действие дня?",
            options: ["В конец списка «если успею»", "Первым делом", "Только на выходные"],
            correct: 1
          },
          {
            q: "Зачем отмечать выполнение?",
            options: ["Для галочки в чужих глазах", "Чтобы мозг учился на доказательствах", "Это лишнее"],
            correct: 1
          }
        ]
      },
      makeup: {
        hooks: [
          "Макияж усиливает лицо, а не маскирует человека",
          "Светлая кожа и аккуратные брови делают больше, чем 10 продуктов",
          "Стойкость начинается с подготовки кожи"
        ],
        tips: [
          "увлажни кожу до тона — так финиш выглядит дороже",
          "ставь акцент либо на глаза, либо на губы — образ читается яснее",
          "проверяй макияж при дневном свете: телефон часто обманывает"
        ],
        quiz: [
          {
            q: "С чего начинается стойкий макияж?",
            options: ["С максимального слоя пудры", "С подготовки и увлажнения кожи", "С самого яркого пигмента"],
            correct: 1
          },
          {
            q: "Как сделать образ чище?",
            options: ["Акцент и на глаза, и на губы сразу", "Выбрать один главный акцент", "Добавить всё, что есть"],
            correct: 1
          },
          {
            q: "Где лучше проверять макияж?",
            options: ["Только в тёмном кафе", "При дневном свете", "Только через beauty-фильтр"],
            correct: 1
          },
          {
            q: "Что часто «делает» лицо без сложных техник?",
            options: ["10 слоёв контуринга", "Ухоженная кожа и аккуратные брови", "Только чёрная подводка"],
            correct: 1
          },
          {
            q: "Главная роль макияжа?",
            options: ["Спрятать личность", "Усилить лицо и настроение", "Повторить чужой тренд 1 в 1"],
            correct: 1
          }
        ]
      }
    };

    const expertsEl = document.getElementById("experts");
    const resultEl = document.getElementById("result");
    const generateBtn = document.getElementById("generate");
    const copyBtn = document.getElementById("copy");
    const hintEl = document.getElementById("hint");

    let lastContent = null;

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function selectedExperts() {
      return [...expertsEl.querySelectorAll("input:checked")].map((input) => {
        const meta = EXPERTS.find((e) => e.id === input.value);
        return { id: input.value, label: meta.label };
      });
    }

    function buildPost(experts) {
      const labels = experts.map((e) => e.label.toLowerCase()).join(", ");
      const hooks = experts.map((e) => pick(CONTENT[e.id].hooks));
      const tips = experts.flatMap((e) => CONTENT[e.id].tips);
      const chosenTips = shuffle(tips).slice(0, Math.min(3, tips.length));

      const intro = experts.length === 1
        ? `${hooks[0]}.`
        : `Сегодня — взгляд сразу нескольких экспертов: ${labels}.`;

      const body = chosenTips
        .map((tip, i) => `${i + 1}) ${tip.charAt(0).toUpperCase()}${tip.slice(1)}.`)
        .join("\n");

      const outro = experts.length === 1
        ? `Сохрани и попробуй один приём уже сегодня — потом проверь себя в мини-тесте ниже.`
        : `Возьми один совет от каждого направления и собери свой ритуал дня. А в конце — мини-тест, чтобы закрепить.`;

      return [
        `День 1 · познавательный пост`,
        ``,
        intro,
        ``,
        body,
        ``,
        outro,
        ``,
        `А тебе что ближе — практика сразу или сначала теория? Напиши в комментариях.`
      ].join("\n");
    }

    function buildQuiz(experts) {
      const pool = experts.flatMap((e) =>
        CONTENT[e.id].quiz.map((item) => ({ ...item, expert: e.label }))
      );
      return shuffle(pool).slice(0, 5).map((item) => {
        const indexed = item.options.map((text, idx) => ({ text, idx }));
        const shuffled = shuffle(indexed);
        const correct = shuffled.findIndex((opt) => opt.idx === item.correct);
        return {
          q: item.q,
          expert: item.expert,
          options: shuffled.map((opt) => opt.text),
          correct
        };
      });
    }

    function generateContent(experts) {
      return {
        experts,
        post: buildPost(experts),
        quiz: buildQuiz(experts)
      };
    }

    function renderExperts() {
      expertsEl.innerHTML = EXPERTS.map((expert) => `
        <label class="expert-chip">
          <input type="checkbox" name="expert" value="${expert.id}" />
          <span>${expert.label}</span>
        </label>
      `).join("");
    }

    function render(content) {
      const tags = content.experts.map((e) => `<span>${e.label}</span>`).join("");
      const quizHtml = content.quiz.map((item, qi) => `
        <div class="question" data-question="${qi}">
          <p class="question-title">${qi + 1}. ${item.q}</p>
          <div class="options">
            ${item.options.map((opt, oi) => `
              <button
                type="button"
                class="option"
                data-question="${qi}"
                data-option="${oi}"
              >${opt}</button>
            `).join("")}
          </div>
          <p class="feedback" data-feedback="${qi}"></p>
        </div>
      `).join("");

      resultEl.innerHTML = `
        <article class="panel">
          <div class="panel-head">
            <h2 class="panel-title">День 1</h2>
            <span class="panel-meta">Пост · познавательное · вовлечение</span>
          </div>
          <span class="label">Пост</span>
          <p class="post-text">${content.post}</p>
          <div class="expert-tags">${tags}</div>
        </article>
        <article class="panel">
          <div class="panel-head">
            <h2 class="panel-title">Мини-тест</h2>
            <span class="panel-meta">5 вопросов · 3 варианта</span>
          </div>
          <p class="label">Выбери ответ — сразу увидишь правильный</p>
          <div class="quiz">${quizHtml}</div>
        </article>
      `;
    }

    function contentToText(content) {
      const lines = [
        "ЧУДЕСА — контент на день 1",
        `Эксперты: ${content.experts.map((e) => e.label).join(", ")}`,
        "",
        content.post,
        "",
        "Мини-тест:"
      ];
      content.quiz.forEach((item, i) => {
        lines.push(`${i + 1}. ${item.q}`);
        item.options.forEach((opt, oi) => {
          const mark = oi === item.correct ? " ✓" : "";
          lines.push(`   ${String.fromCharCode(65 + oi)}) ${opt}${mark}`);
        });
        lines.push("");
      });
      return lines.join("\n");
    }

    resultEl.addEventListener("click", (event) => {
      const btn = event.target.closest(".option");
      if (!btn || !lastContent) return;

      const qi = Number(btn.dataset.question);
      const oi = Number(btn.dataset.option);
      const question = lastContent.quiz[qi];
      if (!question || question.answered) return;

      question.answered = true;
      const root = resultEl.querySelector(`[data-question="${qi}"]`);
      const feedback = resultEl.querySelector(`[data-feedback="${qi}"]`);
      const options = root.querySelectorAll(".option");

      options.forEach((option) => {
        option.disabled = true;
        const idx = Number(option.dataset.option);
        if (idx === question.correct) option.classList.add("is-correct");
        if (idx === oi && oi !== question.correct) option.classList.add("is-wrong");
      });

      if (oi === question.correct) {
        feedback.textContent = "Верно! Так держать.";
        feedback.className = "feedback ok";
      } else {
        feedback.textContent = `Правильный ответ: ${question.options[question.correct]}`;
        feedback.className = "feedback bad";
      }
    });

    generateBtn.addEventListener("click", () => {
      const experts = selectedExperts();
      if (!experts.length) {
        hintEl.textContent = "Выбери хотя бы одного эксперта";
        return;
      }
      hintEl.textContent = "";
      lastContent = generateContent(experts);
      render(lastContent);
      copyBtn.hidden = false;
      copyBtn.textContent = "Скопировать контент";
    });

    copyBtn.addEventListener("click", async () => {
      if (!lastContent) return;
      try {
        await navigator.clipboard.writeText(contentToText(lastContent));
        copyBtn.textContent = "Скопировано";
        setTimeout(() => { copyBtn.textContent = "Скопировать контент"; }, 1600);
      } catch {
        copyBtn.textContent = "Не удалось скопировать";
      }
    });

    renderExperts();
  </script>
</body>
