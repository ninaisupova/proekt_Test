<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --bg-elevated: #0d0d0f;
      --ink: #f2f2f4;
      --muted: #9a9aa3;
      --silver: #c8ccd4;
      --silver-bright: #eef1f6;
      --silver-dim: #8a909c;
      --line: rgba(200, 204, 212, 0.18);
      --card: rgba(16, 16, 18, 0.88);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background: var(--bg);
      padding: 2rem 1.25rem 3rem;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 45% at 50% -5%, rgba(200, 204, 212, 0.14), transparent 55%),
        radial-gradient(ellipse 40% 30% at 90% 20%, rgba(170, 175, 185, 0.08), transparent 50%),
        radial-gradient(ellipse 35% 28% at 8% 70%, rgba(180, 185, 195, 0.06), transparent 50%),
        linear-gradient(180deg, #050505 0%, #0a0a0c 50%, #050505 100%);
      z-index: 0;
    }

    .silver-dust {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .silver-dust span {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--silver-bright);
      box-shadow: 0 0 8px rgba(238, 241, 246, 0.8);
      opacity: 0;
      animation: sparkle 5.5s ease-in-out infinite;
    }

    .silver-dust span:nth-child(1) { left: 12%; top: 18%; animation-delay: 0s; }
    .silver-dust span:nth-child(2) { left: 78%; top: 12%; animation-delay: 1.1s; width: 3px; height: 3px; }
    .silver-dust span:nth-child(3) { left: 55%; top: 28%; animation-delay: 2.2s; }
    .silver-dust span:nth-child(4) { left: 22%; top: 62%; animation-delay: 0.7s; }
    .silver-dust span:nth-child(5) { left: 88%; top: 55%; animation-delay: 1.8s; width: 3px; height: 3px; }
    .silver-dust span:nth-child(6) { left: 40%; top: 78%; animation-delay: 3s; }
    .silver-dust span:nth-child(7) { left: 66%; top: 88%; animation-delay: 0.4s; }
    .silver-dust span:nth-child(8) { left: 8%; top: 40%; animation-delay: 2.6s; }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 2.25rem;
      animation: rise 0.8s ease both;
    }

    .brand {
      font-family: "Cinzel", serif;
      font-size: clamp(2.8rem, 9vw, 4.8rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1.05;
      background: linear-gradient(
        110deg,
        #7a7f88 0%,
        #c8ccd4 22%,
        #ffffff 38%,
        #a8adb8 55%,
        #eef1f6 72%,
        #8a909c 100%
      );
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: silverFlow 4.5s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(200, 204, 212, 0.25));
    }

    .brand-line {
      width: min(220px, 50vw);
      height: 1px;
      margin: 1rem auto 0;
      background: linear-gradient(90deg, transparent, var(--silver), transparent);
      position: relative;
      overflow: hidden;
    }

    .brand-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      transform: translateX(-100%);
      animation: lineSweep 2.8s ease-in-out infinite;
    }

    .subtitle {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 34rem;
      margin-inline: auto;
      animation: fadeIn 1s ease 0.25s both;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
      animation: rise 0.8s ease 0.12s both;
    }

    label {
      font-size: 0.9rem;
      color: var(--silver-dim);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    select {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--bg-elevated);
      color: var(--ink);
      border-radius: 10px;
      padding: 0.55rem 0.8rem;
      min-width: 11rem;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    select:focus {
      outline: none;
      border-color: rgba(200, 204, 212, 0.55);
      box-shadow: 0 0 0 3px rgba(200, 204, 212, 0.12);
    }

    select option {
      background: #111;
      color: var(--ink);
    }

    button {
      font: inherit;
      font-weight: 700;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 0.75rem 1.4rem;
      transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      position: relative;
      overflow: hidden;
      color: #0a0a0c;
      background: linear-gradient(135deg, #9aa0aa 0%, #e8ebf0 45%, #b8bec8 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2),
        0 8px 28px rgba(200, 204, 212, 0.22);
    }

    .btn-primary::before {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      animation: btnShine 2.8s ease-in-out infinite;
    }

    .btn-primary:hover {
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35),
        0 10px 36px rgba(220, 224, 232, 0.35);
    }

    .btn-ghost {
      background: transparent;
      color: var(--silver);
      border: 1px solid rgba(200, 204, 212, 0.35);
    }

    .btn-ghost:hover {
      background: rgba(200, 204, 212, 0.08);
      border-color: rgba(200, 204, 212, 0.65);
      box-shadow: 0 0 20px rgba(200, 204, 212, 0.12);
    }

    .week {
      display: grid;
      gap: 1rem;
    }

    .day {
      position: relative;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.15rem 1.25rem 1.3rem;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: riseSilver 0.65s ease both;
    }

    .day::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(238, 241, 246, 0.7), transparent);
      animation: borderGlow 3.2s ease-in-out infinite;
    }

    .day:hover {
      border-color: rgba(200, 204, 212, 0.35);
      box-shadow:
        var(--shadow),
        0 0 28px rgba(200, 204, 212, 0.08);
    }

    .day:nth-child(1) { animation-delay: 0.05s; }
    .day:nth-child(2) { animation-delay: 0.1s; }
    .day:nth-child(3) { animation-delay: 0.15s; }
    .day:nth-child(4) { animation-delay: 0.2s; }
    .day:nth-child(5) { animation-delay: 0.25s; }
    .day:nth-child(6) { animation-delay: 0.3s; }
    .day:nth-child(7) { animation-delay: 0.35s; }

    .day-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--line);
    }

    .day-name {
      font-family: "Cinzel", serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--silver-bright);
    }

    .theme {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--silver-dim), var(--silver-bright), var(--silver-dim));
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: silverFlow 3.5s linear infinite;
    }

    .block { margin-top: 0.85rem; }

    .label {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--silver);
      margin-bottom: 0.35rem;
      text-shadow: 0 0 12px rgba(200, 204, 212, 0.35);
    }

    .post {
      font-size: 1.02rem;
      line-height: 1.45;
      font-weight: 600;
      color: var(--ink);
    }

    .stories {
      list-style: none;
      display: grid;
      gap: 0.45rem;
      margin-top: 0.25rem;
    }

    .stories li {
      position: relative;
      padding-left: 1.1rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .stories li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--silver);
      box-shadow: 0 0 8px rgba(200, 204, 212, 0.7);
      animation: pulseDot 2.4s ease-in-out infinite;
    }

    .stories li:nth-child(2)::before { animation-delay: 0.4s; }
    .stories li:nth-child(3)::before { animation-delay: 0.8s; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
      border: 1px dashed rgba(200, 204, 212, 0.28);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.02);
      animation: rise 0.6s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes riseSilver {
      from {
        opacity: 0;
        transform: translateY(18px);
        box-shadow: 0 0 0 rgba(200, 204, 212, 0);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        box-shadow: var(--shadow);
      }
    }

    @keyframes silverFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes lineSweep {
      0%, 20% { transform: translateX(-100%); }
      55%, 100% { transform: translateX(120%); }
    }

    @keyframes btnShine {
      0%, 35% { left: -40%; }
      70%, 100% { left: 120%; }
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.6); }
      40%, 60% { opacity: 0.9; transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 560px) {
      .day-head { flex-direction: column; align-items: flex-start; }
      .controls { flex-direction: column; }
      select, button { width: 100%; }
      .brand { letter-spacing: 0.14em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

          "Вопрос подписчикам в стикере",
          "Вечерняя благодарность",
          "Напоминание: тебе можно медленно"
        ]
      }
    };

    const nicheEl = document.getElementById("niche");
    const weekEl = document.getElementById("week");
    const generateBtn = document.getElementById("generate");
    const copyBtn = document.getElementById("copy");

    let lastPlan = null;

    function pick(arr, used) {
      const available = arr.filter((x) => !used.has(x));
      const pool = available.length ? available : arr;
      const item = pool[Math.floor(Math.random() * pool.length)];
      used.add(item);
      return item;
    }

    function generateWeek(niche) {
      const data = BANK[niche];
      const usedPosts = new Set();
      const usedStories = new Set();
      const usedThemes = new Set();

      return DAYS.map((day) => {
        const theme = pick(THEMES, usedThemes);
        const post = pick(data.posts, usedPosts);
        const stories = [0, 1, 2].map(() => pick(data.stories, usedStories));
        return { day, theme, post, stories };
      });
    }

    function render(plan) {
      weekEl.innerHTML = plan.map(({ day, theme, post, stories }) => `
        <article class="day">
          <div class="day-head">
            <h2 class="day-name">${day}</h2>
            <span class="theme">${theme}</span>
          </div>
          <div class="block">
            <span class="label">Пост</span>
            <p class="post">${post}</p>
          </div>
          <div class="block">
            <span class="label">Сторис × 3</span>
            <ul class="stories">
              ${stories.map((s) => `<li>${s}</li>`).join("")}
            </ul>
          </div>
        </article>
      `).join("");
    }

    function planToText(plan, nicheLabel) {
      const lines = [`ЧУДЕСА — контент-план на неделю`, `Ниша: ${nicheLabel}`, ""];
      plan.forEach(({ day, theme, post, stories }) => {
        lines.push(`${day} — ${theme}`);
        lines.push(`Пост: ${post}`);
        lines.push(`Сторис 1: ${stories[0]}`);
        lines.push(`Сторис 2: ${stories[1]}`);
        lines.push(`Сторис 3: ${stories[2]}`);
        lines.push("");
      });
      return lines.join("\n");
    }

    generateBtn.addEventListener("click", () => {
      lastPlan = generateWeek(nicheEl.value);
      render(lastPlan);
      copyBtn.hidden = false;
      copyBtn.textContent = "Скопировать план";
    });

    copyBtn.addEventListener("click", async () => {
      if (!lastPlan) return;
      const label = nicheEl.options[nicheEl.selectedIndex].text;
      try {
        await navigator.clipboard.writeText(planToText(lastPlan, label));
        copyBtn.textContent = "Скопировано";
        setTimeout(() => { copyBtn.textContent = "Скопировать план"; }, 1600);
      } catch {
        copyBtn.textContent = "Не удалось скопировать";
      }
    });
  </script>
</body>
</html>
