<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ЧУДЕСА — генератор контента</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --bg-elevated: #0d0d0f;
      --ink: #f2f2f4;
      --muted: #9a9aa3;
      --silver: #c8ccd4;
      --silver-bright: #eef1f6;
      --silver-dim: #8a909c;
      --line: rgba(200, 204, 212, 0.18);
      --card: rgba(16, 16, 18, 0.88);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      --ok: #8fd4a8;
      --bad: #e8a0a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background: var(--bg);
      padding: 2rem 1.25rem 3rem;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 45% at 50% -5%, rgba(200, 204, 212, 0.14), transparent 55%),
        radial-gradient(ellipse 40% 30% at 90% 20%, rgba(170, 175, 185, 0.08), transparent 50%),
        radial-gradient(ellipse 35% 28% at 8% 70%, rgba(180, 185, 195, 0.06), transparent 50%),
        linear-gradient(180deg, #050505 0%, #0a0a0c 50%, #050505 100%);
      z-index: 0;
    }

    .silver-dust {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .silver-dust span {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--silver-bright);
      box-shadow: 0 0 8px rgba(238, 241, 246, 0.8);
      opacity: 0;
      animation: sparkle 5.5s ease-in-out infinite;
    }

    .silver-dust span:nth-child(1) { left: 12%; top: 18%; animation-delay: 0s; }
    .silver-dust span:nth-child(2) { left: 78%; top: 12%; animation-delay: 1.1s; width: 3px; height: 3px; }
    .silver-dust span:nth-child(3) { left: 55%; top: 28%; animation-delay: 2.2s; }
    .silver-dust span:nth-child(4) { left: 22%; top: 62%; animation-delay: 0.7s; }
    .silver-dust span:nth-child(5) { left: 88%; top: 55%; animation-delay: 1.8s; width: 3px; height: 3px; }
    .silver-dust span:nth-child(6) { left: 40%; top: 78%; animation-delay: 3s; }
    .silver-dust span:nth-child(7) { left: 66%; top: 88%; animation-delay: 0.4s; }
    .silver-dust span:nth-child(8) { left: 8%; top: 40%; animation-delay: 2.6s; }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 2.25rem;
      animation: rise 0.8s ease both;
    }

    .brand {
      font-family: "Cinzel", serif;
      font-size: clamp(2.8rem, 9vw, 4.8rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1.05;
      background: linear-gradient(
        110deg,
        #7a7f88 0%,
        #c8ccd4 22%,
        #ffffff 38%,
        #a8adb8 55%,
        #eef1f6 72%,
        #8a909c 100%
      );
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: silverFlow 4.5s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(200, 204, 212, 0.25));
    }

    .brand-line {
      width: min(220px, 50vw);
      height: 1px;
      margin: 1rem auto 0;
      background: linear-gradient(90deg, transparent, var(--silver), transparent);
      position: relative;
      overflow: hidden;
    }

    .brand-line::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      transform: translateX(-100%);
      animation: lineSweep 2.8s ease-in-out infinite;
    }

    .subtitle {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 36rem;
      margin-inline: auto;
      animation: fadeIn 1s ease 0.25s both;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.25rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.25rem;
      animation: rise 0.8s ease 0.1s both;
    }

    .panel-title {
      font-family: "Cinzel", serif;
      letter-spacing: 0.08em;
      font-size: 1rem;
      color: var(--silver-bright);
      margin-bottom: 0.9rem;
    }

    .experts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.65rem;
    }

    .expert {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      text-align: center;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      border-radius: 14px;
      padding: 0.85rem 0.5rem;
      font: inherit;
      font-weight: 600;
      transition: border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .expert:hover {
      border-color: rgba(200, 204, 212, 0.4);
      color: var(--silver);
    }

    .expert.is-active {
      color: #0a0a0c;
      background: linear-gradient(135deg, #9aa0aa 0%, #e8ebf0 45%, #b8bec8 100%);
      border-color: transparent;
      box-shadow: 0 0 22px rgba(200, 204, 212, 0.25);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin: 1.25rem 0 1.75rem;
      animation: rise 0.8s ease 0.15s both;
    }

    button {
      font: inherit;
      font-weight: 700;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 0.75rem 1.4rem;
      transition: transform 0.15s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      position: relative;
      overflow: hidden;
      color: #0a0a0c;
      background: linear-gradient(135deg, #9aa0aa 0%, #e8ebf0 45%, #b8bec8 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2),
        0 8px 28px rgba(200, 204, 212, 0.22);
    }

    .btn-primary::before {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      animation: btnShine 2.8s ease-in-out infinite;
    }

    .btn-primary:hover {
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.35),
        0 10px 36px rgba(220, 224, 232, 0.35);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .result { display: grid; gap: 1rem; }

    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.2rem 1.25rem 1.35rem;
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: riseSilver 0.65s ease both;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(238, 241, 246, 0.7), transparent);
      animation: borderGlow 3.2s ease-in-out infinite;
    }

    .label {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--silver);
      margin-bottom: 0.55rem;
      text-shadow: 0 0 12px rgba(200, 204, 212, 0.35);
    }

    .post-title {
      font-family: "Cinzel", serif;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      color: var(--silver-bright);
      margin-bottom: 0.65rem;
    }

    .post-body {
      color: var(--muted);
      line-height: 1.55;
      white-space: pre-line;
    }

    .hook {
      margin-top: 0.9rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--line);
      color: var(--ink);
      font-weight: 600;
      line-height: 1.45;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: baseline;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .score {
      font-size: 0.9rem;
      color: var(--silver);
      font-weight: 700;
    }

    .question {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.95rem 1rem;
      margin-bottom: 0.75rem;
      background: rgba(255, 255, 255, 0.02);
    }

    .question h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.7rem;
      line-height: 1.4;
    }

    .options {
      display: grid;
      gap: 0.45rem;
    }

    .option {
      text-align: left;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      padding: 0.7rem 0.85rem;
      font-weight: 600;
    }

    .option:hover:not(:disabled) {
      border-color: rgba(200, 204, 212, 0.5);
      box-shadow: 0 0 16px rgba(200, 204, 212, 0.1);
    }

    .option:disabled { cursor: default; }

    .option.is-correct {
      border-color: rgba(143, 212, 168, 0.7);
      background: rgba(143, 212, 168, 0.12);
      color: var(--ok);
    }

    .option.is-wrong {
      border-color: rgba(232, 160, 160, 0.55);
      background: rgba(232, 160, 160, 0.1);
      color: var(--bad);
    }

    .feedback {
      margin-top: 0.55rem;
      font-size: 0.9rem;
      color: var(--silver-dim);
      min-height: 1.2em;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
      border: 1px dashed rgba(200, 204, 212, 0.28);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.02);
      animation: rise 0.6s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes riseSilver {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes silverFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes lineSweep {
      0%, 20% { transform: translateX(-100%); }
      55%, 100% { transform: translateX(120%); }
    }

    @keyframes btnShine {
      0%, 35% { left: -40%; }
      70%, 100% { left: 120%; }
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.6); }
      40%, 60% { opacity: 0.9; transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 560px) {
      .brand { letter-spacing: 0.14em; }
      .actions button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="silver-dust" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="wrap">
    <header>
      <h1 class="brand">ЧУДЕСА</h1>
      <div class="brand-line" aria-hidden="true"></div>
      <p class="subtitle">Выбери эксперта — получи познавательный пост на день и мини-тест из 5 вопросов</p>
    </header>

    <section class="panel">
      <h2 class="panel-title">Эксперт</h2>
      <div class="experts" id="experts" role="listbox" aria-label="Выбор эксперта"></div>
    </section>

    <div class="actions">
      <button class="btn-primary" id="generate" type="button" disabled>Сгенерировать</button>
    </div>

    <div class="result" id="result">
      <div class="empty">Выбери эксперта и нажми «Сгенерировать»</div>
    </div>
  </div>

  <script>
    const EXPERTS = [
      { id: "photo", name: "Фотограф" },
      { id: "psych", name: "Психолог" },
      { id: "coach", name: "Тренер" },
      { id: "nutri", name: "Нутрициолог" },
      { id: "style", name: "Стилист" },
      { id: "speech", name: "Логопед" },
      { id: "finance", name: "Финансовый советник" },
      { id: "career", name: "Карьерный коуч" }
    ];

    const CONTENT = {
      photo: {
        posts: [
          {
            title: "Свет решает всё: почему «плохое фото» часто просто плохо освещено",
            body: "Камера ловит не красоту — она ловит свет. Жёсткий потолочный свет даёт тени под глазами, а мягкий боковой делает лицо объёмным.\n\nПопробуй правило: источник света сбоку и чуть выше лица. Даже у окна в пасмурный день портрет выглядит живее, чем при вспышке в лоб.\n\nПознавательный факт: отражённый свет (от стены или отражателя) мягче прямого — поэтому «белый лист бумаги» рядом с лицом работает как мини-студия.",
            hook: "А ты чаще снимаешь у окна или при искусственном свете? Напиши в комментариях — разберём твой типичный сценарий."
          },
          {
            title: "Композиция за 10 секунд: как сделать кадр «дороже»",
            body: "Дорогая картинка — это не обязательно дорогая камера. Часто хватает трёх приёмов: чистый фон, воздух вокруг героя и один акцент.\n\nУбери лишнее из кадра. Сдвинь объект с центра по правилу третей. Оставь пространство «взгляду» — туда, куда смотрит человек.\n\nВовлечение начинается с узнавания: зритель должен понять сюжет за секунду.",
            hook: "Сохрани пост и отметь друга, которому вечно «режет» кадр по локтям."
          }
        ],
        quiz: [
          {
            q: "Какой свет обычно делает портрет мягче?",
            options: ["Жёсткий прямой свет в лицо", "Рассеянный / отражённый свет", "Вспышка без рассеивателя"],
            correct: 1
          },
          {
            q: "Что чаще всего портит композицию?",
            options: ["Чистый фон", "Лишние объекты за спиной", "Воздух вокруг героя"],
            correct: 1
          },
          {
            q: "Правило третей помогает…",
            options: ["Только в пейзаже", "Разместить объект не по центру выразительнее", "Увеличить ISO"],
            correct: 1
          },
          {
            q: "Почему важно оставлять «воздух взгляду»?",
            options: ["Чтобы кадр не выглядел «зажатым»", "Чтобы увеличить резкость", "Чтобы убрать шумы"],
            correct: 0
          },
          {
            q: "Что сильнее влияет на «дорогой» вид фото?",
            options: ["Только бренд камеры", "Свет + композиция + чистота кадра", "Только фильтр в приложении"],
            correct: 1
          }
        ]
      },
      psych: {
        posts: [
          {
            title: "Почему «просто успокойся» почти никогда не работает",
            body: "Нервная система не слушает приказы — она реагирует на безопасность. Когда нам говорят «не переживай», мозг слышит обесценивание, а тревога растёт.\n\nРабочий путь: назвать чувство («мне тревожно»), дать телу опору (дыхание, стопы на полу) и только потом решать задачу.\n\nПознавательно: эмоция — сигнал, а не враг. Она указывает на потребность: в отдыхе, ясности, поддержке или границах.",
            hook: "Какая фраза тебя обычно бесит в стрессе? Напиши — соберём «антискрипт» из комментариев."
          },
          {
            title: "Маленькие границы = большая энергия",
            body: "Граница — это не стена. Это ясное «да» и честное «нет». Без них мы тратим силы на чужие ожидания и злимся «вдруг».\n\nНачни с микро-границы: отвечать на сообщения в своё время, не брать работу «на 5 минут» вечером, просить паузу в споре.\n\nВовлечение: люди узнают себя мгновенно — и хотят поделиться своим опытом.",
            hook: "Поставь «+», если сегодня скажешь одно спокойное «нет»."
          }
        ],
        quiz: [
          {
            q: "Что чаще помогает снизить тревогу быстрее приказа «успокоиться»?",
            options: ["Игнорировать чувство", "Назвать чувство и опереться на тело", "Спорить с собой сильнее"],
            correct: 1
          },
          {
            q: "Граница — это…",
            options: ["Всегда конфликт", "Ясность своих «да» и «нет»", "Полный отказ от общения"],
            correct: 1
          },
          {
            q: "Эмоция чаще всего сигнализирует о…",
            options: ["Слабости характера", "Потребности", "Необходимости всё бросить"],
            correct: 1
          },
          {
            q: "Микро-граница — это пример…",
            options: ["Отвечать сразу всем", "Не брать «ещё одну мелочь» поздно вечером", "Молчать и копить"],
            correct: 1
          },
          {
            q: "Почему обесценивание усиливает тревогу?",
            options: ["Мозг чувствует небезопасность и непонимание", "Потому что слова длинные", "Потому что так всегда полезно"],
            correct: 0
          }
        ]
      },
      coach: {
        posts: [
          {
            title: "Прогресс быстрее, если тренировка короче — но регулярнее",
            body: "Мотивация любит длинные планы. Результат любит повторяемость. 25–40 минут 3–4 раза в неделю часто сильнее редких «геройских» двухчасовых забегов.\n\nСекрет вовлечения тела: разминка → основная работа → короткая заминка. Так меньше травм и больше желания вернуться завтра.\n\nФакт: мышцы растут в восстановлении. Без сна и белка «идеальная» тренировка работает вполовину.",
            hook: "Сколько минут реально готов(а) тренироваться в будни без самообмана? Напиши цифру."
          },
          {
            title: "Техника важнее веса: как не «убить» поясницу",
            body: "Большой вес с кривой техникой — это ускоренный путь к паузе. Начни с контроля: корпус стабилен, колени смотрят по направлению носков, движение контролируемое.\n\nЛучший индикатор: ты можешь сделать подход и спокойно говорить 1–2 фразы. Если только хрип и хаос — снижай нагрузку.\n\nПознавательно и вовлекающе: правильная техника — это уважение к будущему себе.",
            hook: "Сохрани и отметь напарника по залу — пусть проверит твою технику на видео."
          }
        ],
        quiz: [
          {
            q: "Что чаще даёт устойчивый прогресс?",
            options: ["Редкие сверхдлинные тренировки", "Регулярные умеренные занятия", "Только отдых без нагрузки"],
            correct: 1
          },
          {
            q: "Когда мышцы в основном восстанавливаются и адаптируются?",
            options: ["Только во время подхода", "В восстановлении (сон, питание, пауза)", "Только при максимальном весе"],
            correct: 1
          },
          {
            q: "Признак, что нагрузка слишком хаотичная:",
            options: ["Контроль и ровное дыхание", "Нельзя сохранить технику", "Лёгкая разминка"],
            correct: 1
          },
          {
            q: "Зачем нужна заминка?",
            options: ["Чтобы «сжечь» калории магически", "Плавно завершить нагрузку и снизить риск скованности", "Чтобы увеличить вес на штанге"],
            correct: 1

    const expertsEl = document.getElementById("experts");
    const generateBtn = document.getElementById("generate");
    const resultEl = document.getElementById("result");

    let selectedExpert = null;
    let answered = 0;
    let correctCount = 0;

    EXPERTS.forEach((expert) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "expert";
      btn.textContent = expert.name;
      btn.dataset.id = expert.id;
      btn.setAttribute("role", "option");
      btn.setAttribute("aria-selected", "false");
      btn.addEventListener("click", () => selectExpert(expert.id));
      expertsEl.appendChild(btn);
    });

    function selectExpert(id) {
      selectedExpert = id;
      generateBtn.disabled = false;
      expertsEl.querySelectorAll(".expert").forEach((btn) => {
        const active = btn.dataset.id === id;
        btn.classList.toggle("is-active", active);
        btn.setAttribute("aria-selected", active ? "true" : "false");
      });
    }

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function updateScore() {
      const scoreEl = document.getElementById("score");
      if (!scoreEl) return;
      scoreEl.textContent = `Отвечено: ${answered}/5 · Верно: ${correctCount}`;
    }

    function render(expertId) {
      const pack = CONTENT[expertId];
      const post = pick(pack.posts);
      const expertName = EXPERTS.find((e) => e.id === expertId).name;
      answered = 0;
      correctCount = 0;

      resultEl.innerHTML = `
        <article class="card">
          <span class="label">Пост дня · ${expertName}</span>
          <h2 class="post-title">${post.title}</h2>
          <p class="post-body">${post.body}</p>
          <p class="hook">${post.hook}</p>
        </article>
        <section class="card" id="quiz">
          <div class="quiz-meta">
            <span class="label">Мини-тест · 5 вопросов</span>
            <span class="score" id="score">Отвечено: 0/5 · Верно: 0</span>
          </div>
          ${pack.quiz.map((item, qi) => `
            <div class="question" data-q="${qi}">
              <h3>${qi + 1}. ${item.q}</h3>
              <div class="options">
                ${item.options.map((opt, oi) => `
                  <button type="button" class="option" data-q="${qi}" data-o="${oi}">${opt}</button>
                `).join("")}
              </div>
              <p class="feedback" data-feedback="${qi}"></p>
            </div>
          `).join("")}
        </section>
      `;

      resultEl.querySelectorAll(".option").forEach((btn) => {
        btn.addEventListener("click", () => {
          const qi = Number(btn.dataset.q);
          const oi = Number(btn.dataset.o);
          const item = pack.quiz[qi];
          const questionEl = resultEl.querySelector(`.question[data-q="${qi}"]`);
          if (questionEl.dataset.done === "1") return;

          questionEl.dataset.done = "1";
          answered += 1;
          const feedback = resultEl.querySelector(`[data-feedback="${qi}"]`);
          const options = questionEl.querySelectorAll(".option");

          options.forEach((optBtn) => {
            optBtn.disabled = true;
            const idx = Number(optBtn.dataset.o);
            if (idx === item.correct) optBtn.classList.add("is-correct");
          });

          if (oi === item.correct) {
            correctCount += 1;
            btn.classList.add("is-correct");
            feedback.textContent = "Верно ✓";
          } else {
            btn.classList.add("is-wrong");
            feedback.textContent = `Неверно. Правильный ответ: «${item.options[item.correct]}»`;
          }

          updateScore();
        });
      });
    }

    generateBtn.addEventListener("click", () => {
      if (!selectedExpert) return;
      render(selectedExpert);
      resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  </script>
